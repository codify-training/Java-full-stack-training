    <!-- reactive form with validations -->
    <form [formGroup]="signinForm">

        <div class="form-group">
            <label for="email">Email address</label>
            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="Enter email"
                required
                formControlName="email"
            />
            <small style="color: red;" *ngIf="signinForm.get('email')?.invalid && (signinForm.get('email')?.touched || signinForm.get('email')?.dirty)">
                <span *ngIf="signinForm.get('email')?.errors?.['required']">Email is required.</span>
                <span *ngIf="signinForm.get('email')?.errors?.['email']">Enter a valid email address.</span>

            </small>

        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Password"
                required
                minlength="6"
                formControlName="password"
            />
            <small style="color: red;" *ngIf="signinForm.get('password')?.invalid && (signinForm.get('password')?.touched || signinForm.get('password')?.dirty)">
                <span *ngIf="signinForm.get('password')?.errors?.['required']">Password is required.</span>
                <span *ngIf="signinForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</span>
            </small>
        </div>

        <button type="submit" class="signin-btn" [disabled]="signinForm.invalid">Sign In</button>
    </form>

    <div class="btm-content">
        <p>Don't have an account? <span class="signup-text" routerLink="/signup">Sign Up</span></p>
    </div>
</div>
